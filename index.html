.sk-body{margin:0;background:var(--paper,#fdfbf4);color:var(--ink,#2a2440);font-family:var(--font-body,"Fredoka",system-ui,sans-serif)}
.sk-root{padding:16px;box-sizing:border-box}
.sk-row{display:flex;flex-wrap:wrap;gap:var(--space-4,16px);align-items:flex-end;justify-content:center}
.sk-cap{font-family:var(--font-display,"Amatic SC",sans-serif);font-weight:700;font-size:26px;line-height:1;text-align:center;margin-top:4px}
.sk-sub{font-size:13px;color:var(--ink-soft,#5b5470);text-align:center}
.sk-phone{width:760px;height:351px;border-radius:var(--radius-phone,36px);overflow:hidden;position:relative;border:4px solid var(--ink,#2a2440);box-shadow:6px 8px 0 var(--ink,#2a2440);background:var(--paper,#fdfbf4)}
.sk-phone>svg{position:absolute;inset:0;width:100%;height:100%}
.sk-btn{font-family:var(--font-body,"Fredoka",sans-serif);font-weight:600;font-size:20px;line-height:1;padding:14px 26px;min-height:52px;color:var(--ink,#2a2440);background:var(--wall-yellow,#f2cf3a);border:3px solid var(--ink,#2a2440);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:3px 4px 0 var(--ink,#2a2440);cursor:pointer}
.sk-btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink,#2a2440)}
.sk-btn.green{background:var(--schach-green,#5fc23f)}
.sk-btn.orange{background:var(--streamer-orange,#ff6a3d)}
.sk-btn.ghost{background:var(--paper,#fdfbf4)}
.sk-btn:focus-visible{outline:3px dashed var(--ink-blue,#1f4fbf);outline-offset:4px}
.sk-card{background:var(--paper,#fdfbf4);border:3px solid var(--ink,#2a2440);border-radius:18px 225px 18px 255px/255px 18px 225px 18px;box-shadow:4px 5px 0 var(--ink,#2a2440);padding:12px}
.sk-card.on{background:#fff6c9;outline:4px dashed var(--streamer-orange,#ff6a3d);outline-offset:5px}
.sk-hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(253,251,244,.9);border:3px solid var(--ink,#2a2440);border-radius:20px 200px 20px 200px/200px 20px 200px 20px;box-shadow:3px 3px 0 var(--ink,#2a2440)}
.sk-score{font-family:var(--font-body,"Fredoka",sans-serif);font-weight:700;font-size:28px;line-height:1}
.sk-lives{display:flex;gap:2px}
.sk-lives svg{width:24px;height:24px}
.sk-chip{font-weight:600;font-size:14px;padding:4px 10px;border:2px solid var(--ink,#2a2440);border-radius:999px;background:var(--neon-yellow,#e4f25a)}
.sk-chip.hero{background:var(--pajama-violet,#4b3bb8);color:#fff}
.sk-title{font-family:var(--font-display,"Amatic SC",sans-serif);font-weight:700;font-size:56px;line-height:.95;color:var(--ink-blue,#1f4fbf);margin:0}
.sk-input{font-family:inherit;font-size:22px;font-weight:500;padding:10px 14px;border:3px solid var(--ink,#2a2440);border-radius:12px 160px 12px 160px/160px 12px 160px 12px;background:#fff;width:100%;box-sizing:border-box;color:var(--ink,#2a2440)}
.sk-board{list-style:none;margin:0;padding:0}
.sk-board li{display:grid;grid-template-columns:34px 34px 1fr auto;align-items:center;gap:8px;padding:5px 6px;border-bottom:2px dashed rgba(42,36,64,.18);font-size:18px}
.sk-board li .n{font-family:var(--font-display,"Amatic SC",sans-serif);font-weight:700;font-size:28px;text-align:center}
.sk-board li .p{font-weight:700;font-variant-numeric:tabular-nums}
.sk-board li.me{background:#fff6c9;border-radius:10px}
.sk-board li svg{width:30px;height:34px}
@keyframes sk-shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.5deg)}40%{transform:rotate(1.2deg)}60%{transform:rotate(-.8deg)}80%{transform:rotate(.5deg)}}
@keyframes sk-aura{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2440;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"Fredoka",system-ui,sans-serif;color:#2a2440}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:844px;height:390px;overflow:hidden;background:#fdfbf4;flex:none;transform-origin:center center}
.screen{position:absolute;inset:0}
.screen[hidden]{display:none}
button{font-family:inherit}
.g-shake{animation:sk-shake 450ms ease-in-out;transform-origin:422px 362px}
.g-aura{animation:sk-aura 1.2s ease-in-out infinite}
.g-blink{animation:g-blink .3s steps(2) infinite}
@keyframes g-blink{50%{opacity:.35}}
.g-pop{animation:g-pop .8s ease-out forwards}
@keyframes g-pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
.g-zap{animation:g-zap .18s steps(1) infinite}
.g-zap2{animation:g-zap .23s steps(1) infinite reverse}

.g-bubble{animation:g-bub .25s ease-out}
@keyframes g-bub{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes o-pulse{0%,100%{opacity:1}50%{opacity:.45}}
.o-pulse{animation:o-pulse 1.4s ease-in-out infinite}
#play:focus{outline:none}
.item{position:absolute;left:0;top:0;pointer-events:none}
.item svg{position:absolute;inset:0}
.pop{position:absolute;font-weight:700;font-size:24px;pointer-events:none}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#2a2440;color:#fdfbf4;text-align:center;padding:24px;z-index:10}
#rotate .t{font-family:"Amatic SC",sans-serif;font-weight:700;font-size:44px;line-height:1;color:#f2cf3a}
#rotate svg{animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}

<script>
// Shared family leaderboard: paste the Google Apps Script web-app URL here.
// Empty = scores are kept only on this device.
const SCORES_URL = '';

const W = 844, CATCH_Y = 250, FLOOR_Y = 350, TOP_Y = 112;
const SPOTS = [110, 214, 318, 422, 526, 630, 734];
const DECOS = ['d-pomegranate','d-etrog','d-star','d-chain','d-grapes','d-apple','d-lantern'];
const WORDS = { peleg: ['ננה', 'עננים', 'אנטון', 'במבה', 'את זה!', 'אטיק', 'שוקו', 'בובה ששש', 'די!', 'בננה', 'שחר', 'שור הולה!', 'חלה', 'בואי!', 'לאאאא'], gefen: ['קקטוס', 'שלום עליכם', 'אין מצב', 'ביקביסט', 'שייק', 'לגו', 'שוקו', 'נוווו', 'אני יכול לישון אצל סבתא?', 'היום חופש?', 'אין לי משחקים בכלל', 'אין לי פיפי!', "גילה גילה ג'בודי!", 'קוואבנגה'] };
const KEY = 'save-the-sukkah-top10', KID_KEY = 'save-the-sukkah-kid', NAME_KEY = 'save-the-sukkah-name';
function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
// ---- sound: all synthesized with Web Audio, no files ----
const MUTE_KEY = 'save-the-sukkah-muted';
const Sfx = {
  ctx: null, zap: null, out: null, muted: load(MUTE_KEY, false),
  setMuted(m) { this.muted = m; store(MUTE_KEY, m); if (this.out) this.out.gain.value = m ? 0 : 1; if (m) this.zapStop(); },
  init() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = this.muted ? 0 : 1; this.out.connect(this.ctx.destination); } }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(type, f0, f1, dur, vol, delay) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.02);
  },
  catch(hero) {
    this.tone('triangle', 520, 1040, 0.12, 0.35);
    this.tone('sine', hero ? 1320 : 1040, hero ? 1760 : 1400, 0.14, 0.22, 0.07);
  },
  miss() {
    this.tone('square', 300, 90, 0.35, 0.18);
    this.tone('sine', 110, 55, 0.3, 0.4, 0.02);
  },
  hallelujah() {
    // hero power-up: a rising 8-bit arcade arpeggio
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + 0.03;
    const seq = [261.6, 329.6, 392, 523.3, 329.6, 392, 523.3, 659.3, 392, 523.3, 659.3, 784, 1046.5];
    seq.forEach((f, i) => {
      const t = t0 + i * 0.055, dur = i === seq.length - 1 ? 0.5 : 0.06;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.05);
    });
  },
  gameOver() {
    // sad trombone: wah, wah, wah, waaah
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + 0.05;
    [[392, 0, 0.38], [370, 0.42, 0.38], [349.2, 0.84, 0.38], [329.6, 1.26, 1.2]].forEach(([f, d, len], i) => {
      const t = t0 + d, o = c.createOscillator(), o2 = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
      o.type = 'sawtooth'; o2.type = 'sawtooth'; o2.detune.value = 8;
      o.frequency.setValueAtTime(f, t); o2.frequency.setValueAtTime(f, t);
      if (i === 3) { const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 6; lg.gain.value = 9; lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency); lfo.start(t); lfo.stop(t + len); o.frequency.linearRampToValueAtTime(f * 0.94, t + len); o2.frequency.linearRampToValueAtTime(f * 0.94, t + len); }
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(1400, t + 0.12); lp.frequency.linearRampToValueAtTime(700, t + len);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.05); g.gain.setValueAtTime(0.22, t + len - 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(lp); o2.connect(lp); lp.connect(g).connect(this.out);
      o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
    });
  },
  zapStart() {
    const c = this.ctx; if (!c || this.zap) return;
    const out = c.createGain(); out.gain.value = 0.0001; out.gain.exponentialRampToValueAtTime(0.12, c.currentTime + 0.3); out.connect(this.out);
    const hum = c.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 58;
    const hum2 = c.createOscillator(); hum2.type = 'square'; hum2.frequency.value = 117;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const wob = c.createOscillator(), wg = c.createGain(); wob.frequency.value = 7; wg.gain.value = 300; wob.connect(wg).connect(lp.frequency);
    hum.connect(lp); hum2.connect(lp); lp.connect(out);
    // crackle: short noise bursts through a high bandpass
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() < 0.004 ? (Math.random() * 2 - 1) : (Math.random() * 2 - 1) * 0.04;
    const nz = c.createBufferSource(); nz.buffer = buf; nz.loop = true;
    const hp = c.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 3200; hp.Q.value = 0.7;
    const ng = c.createGain(); ng.gain.value = 2.2; nz.connect(hp).connect(ng).connect(out);
    [hum, hum2, wob, nz].forEach((n) => n.start());
    this.zap = { out, nodes: [hum, hum2, wob, nz] };
  },
  zapStop() {
    const z = this.zap, c = this.ctx; if (!z || !c) return; this.zap = null;
    const t = c.currentTime; z.out.gain.cancelScheduledValues(t); z.out.gain.setValueAtTime(z.out.gain.value, t); z.out.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    z.nodes.forEach((n) => { try { n.stop(t + 0.3); } catch (e) {} });
  },
};



// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
function useSvg(sym, vb, w, h) {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', vb); s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(SVGNS, 'use'); u.setAttribute('href', '#' + sym); s.appendChild(u); return s;
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---------- fit the 844x390 stage to the screen ----------
function fit() {
  const s = Math.min(window.innerWidth / 844, window.innerHeight / 390);
  $('stage').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 200)); fit();

// ---------- state ----------
const S = { screen: 'title', kid: load(KID_KEY, 'gefen'), name: load(NAME_KEY, ''), board: load(KEY, []), saved: true, meIdx: -1, finalScore: 0 };
let g = null, raf = 0, dragging = false; const keys = {};

function show(screen) {
  S.screen = screen;
  ['title', 'select', 'play', 'over'].forEach((n) => { $('s-' + n).hidden = n !== screen; });
  if (screen === 'select') renderSelect();
  if (screen === 'over') renderOver();
  if (screen === 'play') $('play').focus({ preventScroll: true });
}

function goFullscreen() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => {});
  } catch (e) {}
}

// ---------- select ----------
function renderSelect() {
  document.querySelectorAll('.kid').forEach((b) => {
    const on = b.dataset.kid === S.kid;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
  $('b-board').hidden = !(S.board.length || SCORES_URL);
}
document.querySelectorAll('.kid').forEach((b) => b.addEventListener('click', () => { S.kid = b.dataset.kid; store(KID_KEY, S.kid); renderSelect(); }));
$('b-title').addEventListener('click', () => { Sfx.init(); goFullscreen(); show('select'); });
$('b-start').addEventListener('click', () => start());
$('b-board').addEventListener('click', () => { S.finalScore = 0; S.saved = true; S.meIdx = -1; show('over'); });

// ---------- game ----------
function step(dt) {
  g.t += dt;
  g.level = Math.min(10, 1 + Math.floor(g.t / 20));
  const hero = g.t < g.heroUntil;
  const f = (g.level - 1) / 9;
  const interval = 2.2 - 1.5 * f, fall = 3.2 - 1.8 * f;
  // keyboard
  const kv = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  if (kv) g.tx = Math.max(40, Math.min(804, g.kx + kv * 120));
  // kid eases toward the finger
  const before = g.kx;
  g.kx += (g.tx - g.kx) * Math.min(1, dt * 7 * (hero ? 1.6 : 1));
  if (Math.abs(g.kx - before) > 0.4) g.dir = g.kx > before ? 1 : -1;
  g.moving = Math.abs(g.tx - g.kx) > 6;
  // schedule drops: shake first, then fall
  if (g.t >= g.nextDrop) {
    g.shakeUntil = g.t + 0.45;
    const n = g.level >= 7 && Math.random() < 0.35 ? 3 : g.level >= 4 && Math.random() < 0.4 ? 2 : 1;
    const spots = SPOTS.slice().sort(() => Math.random() - 0.5).slice(0, n);
    spots.forEach((x) => {
      const mask = !hero && Math.random() < 0.07;
      g.pending.push({ at: g.t + 0.45, x, mask, fall: mask ? fall * 1.25 : fall });
    });
    g.nextDrop = g.t + interval;
  }
  if (g.t >= g.nextTalk) {
    const ws = WORDS[S.kid] || WORDS.gefen;
    let w; do { w = ws[Math.floor(Math.random() * ws.length)]; } while (w === g.word && ws.length > 1);
    g.word = w; g.talkUntil = g.t + 1.8; g.nextTalk = g.t + 4 + Math.random() * 5;
  }
  g.pending = g.pending.filter((p) => {
    if (g.t < p.at) return true;
    g.items.push({ id: ++g.id, x: p.x + (Math.random() * 20 - 10), y: TOP_Y, age: 0, fall: p.fall, rot: 0,
      spin: (Math.random() < 0.5 ? -1 : 1) * 20, sym: p.mask ? 'd-hero-mask' : DECOS[Math.floor(Math.random() * DECOS.length)],
      mask: p.mask, state: 'fall' });
    return false;
  });
  // anywhere on the body counts: kid box is ~70px wide from the raised hand (y≈230) to the feet
  const zone = (35 + 20) * (S.kid === 'peleg' ? 1.15 : 1);
  g.items.forEach((it) => {
    if (it.state === 'fall') {
      it.age += dt;
      const p = Math.min(1.2, it.age / it.fall);
      it.y = TOP_Y + (FLOOR_Y - TOP_Y) * p * p;
      it.rot += it.spin * dt;
      if (it.y >= CATCH_Y - 20 && it.y <= 372 && Math.abs(it.x - g.kx) < zone) {
        it.state = 'gone';
        if (it.mask) {
          if (!(g.t < g.heroUntil)) Sfx.hallelujah();
          g.heroUntil = g.t + 8;
          g.pops.push({ id: it.id, x: it.x - 30, y: CATCH_Y - 40, text: 'גיבור!', color: '#4b3bb8', until: g.t + 0.8 });
        } else {
          const pts = hero ? 20 : 10; g.score += pts; Sfx.catch(hero);
          g.pops.push({ id: it.id, x: it.x - 18, y: CATCH_Y - 30, text: '+' + pts, color: hero ? '#4b3bb8' : '#1f4fbf', until: g.t + 0.8 });
        }
      } else if (it.y >= FLOOR_Y) {
        it.y = FLOOR_Y; it.state = 'missed'; it.until = g.t + 0.7;
        if (!it.mask) { g.strikes++; Sfx.miss(); }
      }
    }
  });
  g.items = g.items.filter((it) => it.state === 'fall' || (it.state === 'missed' && g.t < it.until));
  g.pops = g.pops.filter((p) => g.t < p.until);
  if (g.t < g.heroUntil && !Sfx.muted) Sfx.zapStart(); else Sfx.zapStop();
}

function start() {
  Sfx.init(); Sfx.zapStop(); cancelAnimationFrame(raf);
  g = { t: 0, kx: W / 2, tx: W / 2, dir: 1, items: [], pops: [], score: 0, strikes: 0, level: 1,
    nextDrop: 1.2, nextTalk: 2 + Math.random() * 3, talkUntil: 0, word: '', pending: [], shakeUntil: 0, heroUntil: 0, last: 0, id: 0 };
  S.saved = false; S.meIdx = -1;
  $('items').textContent = ''; $('pops').textContent = ''; itemEls.clear(); popEls.clear();
  show('play');
  const loop = (now) => {
    if (!g) return;
    const dt = g.last ? Math.min(0.05, (now - g.last) / 1000) : 0; g.last = now;
    step(dt);
    if (g.strikes >= 5) { over(); return; }
    render();
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}

function over() {
  cancelAnimationFrame(raf); Sfx.zapStop(); Sfx.gameOver();
  S.finalScore = g.score;
  S.saved = !(g.score > 0);
  show('over');
}

const itemEls = new Map(), popEls = new Map();
let lastShake = false, lastLevelTxt = '', lastScore = -1, lastStrikes = -1;
function render() {
  const hero = g.t < g.heroUntil;
  // shake
  const shaking = g.t < g.shakeUntil;
  if (shaking !== lastShake) { $('scene').className = shaking ? 'g-shake' : ''; lastShake = shaking; }
  // items
  const seen = new Set();
  g.items.forEach((it) => {
    seen.add(it.id);
    let el = itemEls.get(it.id);
    const size = it.mask ? 50 : 44;
    if (!el) {
      el = document.createElement('div'); el.className = 'item';
      el.style.width = el.style.height = size + 'px';
      el.appendChild(useSvg(it.sym, '-4 -4 68 68', size, size));
      $('items').appendChild(el); itemEls.set(it.id, el);
    }
    el.style.transform = 'translate(' + Math.round(it.x - size / 2) + 'px,' + Math.round(it.y - size / 2) + 'px) rotate(' + Math.round(it.rot) + 'deg)';
    if (it.state === 'missed' && !el.dataset.missed) { el.dataset.missed = '1'; el.style.opacity = '.85'; el.appendChild(useSvg('u-strike', '0 0 24 24', size, size)); }
  });
  itemEls.forEach((el, id) => { if (!seen.has(id)) { el.remove(); itemEls.delete(id); } });
  // pops
  const pseen = new Set();
  g.pops.forEach((p) => {
    pseen.add(p.id);
    if (!popEls.has(p.id)) {
      const el = document.createElement('div'); el.className = 'pop g-pop'; el.dir = 'ltr';
      el.style.left = Math.round(p.x) + 'px'; el.style.top = Math.round(p.y) + 'px'; el.style.color = p.color; el.textContent = p.text;
      $('pops').appendChild(el); popEls.set(p.id, el);
    }
  });
  popEls.forEach((el, id) => { if (!pseen.has(id)) { el.remove(); popEls.delete(id); } });
  // kid + aura + bubble
  const kid = $('kid');
  kid.style.left = Math.round(g.kx - 48) + 'px';
  kid.style.transform = 'scaleX(' + (g.dir < 0 ? -1 : 1) + ') rotate(' + (g.moving ? 6 : 0) + 'deg)';
  const sym = S.kid + (hero ? '-hero' : '');
  if ($('kid-use').getAttribute('href') !== '#' + sym) $('kid-use').setAttribute('href', '#' + sym);
  $('aura').hidden = !hero;
  if (hero) $('aura').style.transform = 'translateX(' + Math.round(g.kx - 70) + 'px)';
  const talking = g.t < g.talkUntil;
  if ($('bubble').hidden === talking) $('bubble').hidden = !talking;
  if (talking) {
    if ($('bubble-t').textContent !== g.word) $('bubble-t').textContent = g.word;
    $('bubble').style.left = Math.round(Math.max(0, Math.min(W - 220, g.kx - 110))) + 'px';
  }
  // HUD
  if (g.score !== lastScore) { $('score').textContent = g.score.toLocaleString('en-US'); lastScore = g.score; }
  const chip = $('chip');
  const txt = hero ? '×2 · ' + Math.max(0, Math.ceil(g.heroUntil - g.t)) : 'קצב ' + g.level;
  if (txt !== lastLevelTxt) { chip.textContent = txt; chip.dir = hero ? 'ltr' : 'rtl'; lastLevelTxt = txt; }
  chip.className = 'sk-chip' + (hero ? ' hero' + (g.heroUntil - g.t < 2 ? ' g-blink' : '') : '');
  if (g.strikes !== lastStrikes) {
    const l = $('lives'); l.textContent = '';
    for (let i = 0; i < 5; i++) l.appendChild(useSvg(i >= 5 - g.strikes ? 'u-strike' : 'u-life', '0 0 24 24', 24, 24));
    l.setAttribute('aria-label', 'נשארו ' + (5 - g.strikes) + ' עלים'); lastStrikes = g.strikes;
  }
}

// controls
function pointerX(e) { const r = $('play').getBoundingClientRect(); return Math.max(40, Math.min(804, (e.clientX - r.left) * (W / r.width))); }
$('play').addEventListener('pointerdown', (e) => { try { $('play').setPointerCapture(e.pointerId); } catch (x) {} if (g) g.tx = pointerX(e); dragging = true; });
$('play').addEventListener('pointermove', (e) => { if (g && (dragging || e.pointerType === 'mouse')) g.tx = pointerX(e); });
$('play').addEventListener('pointerup', () => { dragging = false; });
$('play').addEventListener('pointercancel', () => { dragging = false; });
$('play').addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); keys[e.key] = true; } });
$('play').addEventListener('keyup', (e) => { keys[e.key] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) Sfx.zapStop(); });

// ---------- leaderboard (local, plus the shared sheet when SCORES_URL is set) ----------
async function fetchBoard() {
  if (!SCORES_URL) return load(KEY, []);
  try {
    const r = await fetch(SCORES_URL + '?action=top', { cache: 'no-store' });
    const list = await r.json();
    if (Array.isArray(list)) { store(KEY, list); return list; }
  } catch (e) {}
  return load(KEY, []);
}
async function postScore(entry) {
  const local = load(KEY, []).concat([entry]).sort((a, b) => b.score - a.score).slice(0, 10);
  store(KEY, local);
  if (!SCORES_URL) return local;
  try {
    // text/plain avoids a CORS preflight, which Apps Script cannot answer
    const r = await fetch(SCORES_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(entry) });
    const list = await r.json();
    if (Array.isArray(list)) { store(KEY, list); return list; }
  } catch (e) {}
  return local;
}
function drawBoard() {
  const ol = $('board'); ol.innerHTML = '';
  $('board-msg').hidden = S.board.length > 0; $('board-msg').textContent = 'עוד אין שיאים. תהיו הראשונים!';
  S.board.forEach((b, i) => {
    const li = document.createElement('li'); if (i === S.meIdx) li.className = 'me';
    li.innerHTML = '<span class="n">' + (i + 1) + '</span><svg viewBox="-6 -8 152 232" aria-hidden="true"><use href="#' + (b.kid === 'peleg' ? 'peleg' : 'gefen') + '"></use></svg><span>' + esc(b.name) + '</span><span class="p" dir="ltr">' + Number(b.score).toLocaleString('en-US') + '</span>';
    ol.appendChild(li);
  });
}
async function renderOver() {
  $('over-title').textContent = S.finalScore || !S.saved ? 'הסוכה נפלה!' : 'טבלת השיאים';
  $('over-score').textContent = (S.finalScore || 0).toLocaleString('en-US');
  $('over-score').hidden = !S.finalScore && S.saved;
  $('g-name').value = S.name || '';
  $('f-save').hidden = S.saved;
  $('board-msg').hidden = false; $('board-msg').textContent = 'טוען…'; $('board').innerHTML = '';
  S.board = await fetchBoard();
  if (!S.saved && S.board.length >= 10 && S.finalScore <= S.board[S.board.length - 1].score) $('f-save').hidden = true;
  drawBoard();
}
$('f-save').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (S.saved) return;
  const name = ($('g-name').value || '').trim().slice(0, 12) || (S.kid === 'peleg' ? 'פלג' : 'גפן');
  S.name = name; store(NAME_KEY, name); S.saved = true;
  $('b-save').disabled = true; $('b-save').textContent = 'שומר…';
  const entry = { name, score: S.finalScore, kid: S.kid, at: Date.now() };
  S.board = await postScore(entry);
  S.meIdx = S.board.findIndex((b) => b.at === entry.at && b.name === entry.name);
  $('f-save').hidden = true; $('b-save').disabled = false; $('b-save').textContent = 'שמרו בטבלה';
  drawBoard();
});
$('b-again').addEventListener('click', () => start());
$('b-kids').addEventListener('click', () => show('select'));

// mute
function drawMute() {
  $('mute-on').style.display = Sfx.muted ? 'none' : '';
  $('mute-off').style.display = Sfx.muted ? '' : 'none';
  $('b-mute').setAttribute('aria-label', Sfx.muted ? 'הפעלת צלילים' : 'השתקה');
  $('b-mute').setAttribute('aria-pressed', Sfx.muted);
}
$('b-mute').addEventListener('click', () => { Sfx.init(); Sfx.setMuted(!Sfx.muted); drawMute(); });
drawMute();
show('title');
</script>
